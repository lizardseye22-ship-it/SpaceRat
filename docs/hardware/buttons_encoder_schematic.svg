<text x="1090" y="140" class="t b">Хоткеи</text>
<text x="1090" y="162" class="s">SW1–SW5 → хоткеи 1–5</text>
<text x="1090" y="184" class="s">ENC вправо → хоткей 6</text>
<text x="1090" y="206" class="s">ENC влево → хоткей 7</text>
<text x="1090" y="228" class="s">ENC нажатие → хоткей 8</text>
<text x="1090" y="250" class="s">(импульс 20–30 мс на щелчок)</text>
<text x="1090" y="284" class="t b">Обвязка</text>
<text x="1090" y="306" class="s">Кнопки: вывод → пин, вывод → GND</text>
<text x="1090" y="328" class="s">Pull-up — внутренние, в прошивке</text>
<text x="1090" y="350" class="s">Дребезг — программно, 5–10 мс</text>
<text x="1090" y="372" class="s">Внешних резисторов нет</text>
<text x="1090" y="406" class="t b">EC11, вид снизу</text>
<text x="1090" y="428" class="s">3 вывода: A · C · B</text>
<text x="1090" y="450" class="s">(C — средний, на GND)</text>
<text x="1090" y="472" class="s">2 вывода: S1 · S2 — кнопка</text>
<text x="1090" y="506" class="t b">Не использовать</text>
<text x="1090" y="528" class="s">PB2 (BOOT1), PB3/PB4/PA15 (JTAG)</text>
<text x="1090" y="550" class="s">PA11/PA12 (USB), PA13/PA14 (SWD)</text>
<text x="1090" y="572" class="s">PA0–PA7 заняты датчиками</text>
<text x="1090" y="606" class="t b">Обозначения</text>
