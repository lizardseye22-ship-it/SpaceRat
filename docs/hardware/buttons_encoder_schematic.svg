<text x="470" y="1036" class="s">R9 и конденсаторы — у кольца</text>
<text x="1090" y="140" class="t b">Кнопки SpaceMouse Pro</text>
<text x="1090" y="162" class="s">SW1–SW4 → 1–4, SW5 → Fit</text>
<text x="1090" y="184" class="s">ENC вправо / влево → T / R</text>
<text x="1090" y="206" class="s">ENC нажатие → F</text>
<text x="1090" y="228" class="s">(щелчок = «нажатие» 30 мс)</text>
<text x="1090" y="250" class="s">SW1 + SW5 при включении —</text>
<text x="1090" y="272" class="s">режим калибровки</text>
<text x="1090" y="306" class="t b">Обвязка</text>
<text x="1090" y="328" class="s">Кнопки: вывод → пин, вывод → GND</text>
<text x="1090" y="350" class="s">Pull-up — внутренние, в прошивке</text>
<text x="1090" y="372" class="s">Дребезг — программно, 5–10 мс</text>
<text x="1090" y="394" class="s">Внешних резисторов нет</text>
<text x="1090" y="428" class="t b">EC11, вид снизу</text>
<text x="1090" y="450" class="s">3 вывода: A · C · B</text>
<text x="1090" y="472" class="s">(C — средний, на GND)</text>
<text x="1090" y="494" class="s">2 вывода: S1 · S2 — кнопка</text>
<text x="1090" y="528" class="t b">Не использовать</text>
<text x="1090" y="550" class="s">PB2 (BOOT1); JTAG выключен</text>
<text x="1090" y="572" class="s">PA11/PA12 (USB), PA13/PA14 (SWD)</text>
<text x="1090" y="594" class="s">PA0–PA7 заняты датчиками</text>
<text x="1090" y="628" class="t b">Кольцо WS2812</text>
<text x="1090" y="650" class="s">PA8 — TIM1_CH1, открытый сток,</text>
<text x="1090" y="672" class="s">5 В-толерантный; R9 1 кОм к 5 В</text>
<text x="1090" y="694" class="s">Питание 5 В с USB (пин 5V)</text>
<text x="1090" y="716" class="s">5V + GND — своей свитой парой,</text>
<text x="1090" y="738" class="s">не через землю датчиков/кнопок</text>
<text x="1090" y="760" class="s">C 470 мкФ + 100 нФ — у кольца</text>
<text x="1090" y="782" class="s">Яркость ограничена в прошивке</text>
<text x="1090" y="816" class="t b">Обозначения</text>
<circle cx="1096" cy="833" r="4.5" fill="#2b2a27"/>
<text x="1110" y="838" class="s">— соединение</text>
