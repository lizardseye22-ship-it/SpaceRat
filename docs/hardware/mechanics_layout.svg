<text x="940" y="700" class="t b">DRV5055A3</text>
<text x="1090" y="700" class="t">5–6 мм</text>
<text x="1260" y="700" class="t">~40–55 мТ</text>
<text x="1410" y="700" class="t">рекомендуется</text>
<text x="940" y="730" class="t">DRV5055A4</text>
<text x="1090" y="730" class="t">3–4 мм</text>
<text x="1260" y="730" class="t">~80–110 мТ</text>
<text x="1410" y="730" class="t">компактно</text>
<line x1="932" y1="648" x2="1552" y2="648" stroke="#8a8378"/>
<text x="940" y="790" class="t b">Важно</text>
<text x="940" y="814" class="s" style="font-size:13px">• Все 4 магнита — одним полюсом вниз (аксиальные, полюса на плоских сторонах).</text>
<text x="940" y="838" class="s" style="font-size:13px">• Зазор сделать регулируемым: проставки / резьба с шагом 0.5 мм.</text>
<text x="940" y="862" class="s" style="font-size:13px">• Стали рядом нет: винты — пластик, латунь или нержавейка A2; пружины подальше от пар.</text>
<text x="940" y="886" class="s" style="font-size:13px">• Проверка: OUT в покое ≈ 2.2–2.5 В, при полном ходе ≤ 3.0 В. Ближе к 3.1 В — увеличить зазор.</text>
<text x="940" y="910" class="s" style="font-size:13px">• Соседние магниты на 35 мм влияют на ~0.5–1 мТ — постоянно, уходит калибровкой нуля.</text>
<text x="940" y="934" class="s" style="font-size:13px">• Основание целиком ≈ 80–90 мм.</text>
</svg>