<text x="1350" y="282" class="t b">Цоколёвка DRV5055, TO-92</text>
<text x="1350" y="304" class="s">маркировкой к себе, слева направо:</text>
<text x="1350" y="326" class="m">1 VCC · 2 GND · 3 OUT</text>
<text x="1350" y="360" class="t b">Где ставить</text>
<text x="1350" y="382" class="s">Компоненты нарисованы там,</text>
<text x="1350" y="404" class="s">где они стоят физически:</text>
<text x="1350" y="426" class="s">C1, C2 — у пина 3.3 Blue Pill</text>
<text x="1350" y="448" class="s">C3–C6 — у ножек своей пары</text>
<text x="1350" y="470" class="s">R1–R8, C7–C14 — у пинов PA0–PA7</text>
<text x="1350" y="492" class="s">(RC-фильтр, опционально)</text>
<path class="w" d="M1346 502 H1370 M1351 507 H1365 M1355 512 H1361"/>
<text x="1378" y="514" class="s">— земля (GND)</text>
<text x="1350" y="548" class="t b">Питание</text>
<text x="1350" y="570" class="s">STM32 ~30–50 мА</text>
<text x="1350" y="592" class="s">8 × DRV5055 48–80 мА</text>
<text x="1350" y="614" class="s">LED ~2–5 мА</text>
<text x="1350" y="636" class="s">Кольцо WS2812 (5 В) до ~230 мА</text>
<text x="1350" y="658" class="t b">Итого до ~370 мА — USB хватает</text>
<text x="1350" y="680" class="s">LDO Blue Pill 150–300 мА, запас есть</text>
<text x="1350" y="714" class="t b">Важно</text>
<text x="1350" y="736" class="s">Датчики — только от 3.3 В, не от 5 В</text>
<text x="1350" y="758" class="s">(иначе выход > 3.3 В на входе АЦП)</text>
<text x="1350" y="780" class="s">Если ПК не видит USB: 1.8 кОм</text>
<text x="1350" y="802" class="s">между PA12 и 3.3 В (фикс R10)</text>
<text x="1350" y="824" class="s">Земля датчиков и кольца WS2812</text>
<text x="1350" y="846" class="s">сходятся только на Blue Pill:</text>
<text x="1350" y="868" class="s">кольцо — своей парой 5V/GND</text>
